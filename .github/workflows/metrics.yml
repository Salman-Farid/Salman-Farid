name: GitHub Metrics
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Cancel outdated runs so they don't pile up in queue
concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@v3.34  # pinned, stable version
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Salman-Farid
          filename: github-metrics.svg
          config_timezone: Asia/Dhaka

          # Base plugins
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_stargazers: yes

          # Contributors - limit 0 fetches EVERYONE, which can hang forever
          plugin_contributors: yes
          plugin_contributors_sections: repositories
          plugin_contributors_limit: 24

          # Optional plugins
          plugin_languages: yes
          plugin_languages_ignored: html,css
          plugin_stars: yes
          plugin_followup: yes

          output_action: commit
